services:
  secop-alertas:
    build: .
    container_name: secop-alertas
    restart: always
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.secop.rule=Host(`secop-alertas.148-230-90-171.nip.io`)"
      - "traefik.http.services.secop.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
